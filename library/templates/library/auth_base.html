<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>{% block title %}Agape Library{% endblock %}</title>
  <link rel="icon" href="{% static 'images/logo.png.png' %}" type="image/png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <link href="{% static 'css/theme.css' %}" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(135deg, var(--primary) 0%, #022c22 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }

    .auth-box {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, .2);
    }

    .auth-logo {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .auth-logo .brand {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .auth-logo .brand span {
      color: var(--accent);
    }

    .auth-logo p {
      font-size: .85rem;
      color: var(--text-muted);
      margin: .25rem 0 0;
    }

    .form-label {
      font-weight: 500;
      font-size: .875rem;
      color: var(--text-main);
    }

    .form-control {
      border-radius: 8px;
      padding: .6rem .9rem;
      border-color: var(--border-color);
      background: var(--bg-main);
      color: var(--text-main);
    }

    .form-control:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(232, 160, 32, .15);
    }

    .btn-submit {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: .7rem;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: background .2s;
      margin-top: .5rem;
    }

    .btn-submit:hover {
      background: #142e48;
    }

    .auth-footer {
      text-align: center;
      margin-top: 1.25rem;
      font-size: .85rem;
      color: var(--text-muted);
    }

    .auth-footer a {
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
    }

    .errorlist {
      color: #dc3545;
      font-size: .82rem;
      list-style: none;
      padding: 0;
      margin: .25rem 0 0;
    }

    .alert {
      border-radius: 8px;
      font-size: .875rem;
    }
  </style>
</head>

<body>
  <div class="auth-box">
    <div class="auth-logo">
      <img src="{% static 'images/logo.png.png' %}" alt="Logo" style="height: 64px; width: 64px; border-radius: 50%; margin-bottom: 10px;">
      <div class="brand">Agape<span>Library</span></div>
      <p>{% block subtitle %}Next-Gen Reading Platform{% endblock %}</p>
    </div>

    {% for message in messages %}
    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}">
      {{ message }}
    </div>
    {% endfor %}

    {% block form %}{% endblock %}

    <div class="auth-footer">{% block footer %}{% endblock %}</div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'js/theme.js' %}?v=2"></script>
</body>

</html>
